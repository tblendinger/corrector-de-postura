[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "posture-guard"
version = "1.0.0"
description = "Real-time posture monitoring desktop application for Windows"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "PySide6>=6.5",
    "opencv-python-headless>=4.8",
    "mediapipe>=0.10",
    "numpy>=1.24",
    "winotify>=1.1",
    "pywin32>=306",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
posture-guard = "posture_guard.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
